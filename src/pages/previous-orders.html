<style>
    .center-div {
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100%;
        margin-top: calc(6vh + 20px);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    }

    #loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.7);
        /* dim the page */
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .loader {
        border: 8px solid #f3f3f3;
        border-top: 8px solid #3498db;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
    }

    .hidden {
        display: none;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
    .customer-inactive{
        display: flex;
        flex-direction: column;
        text-align: center;
        display: none;
    }
</style>

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<include-page url="navigation-bar" />
<div class="center-div" style="color:#6941C6;">

    <div id="customer-deleted" class="customer-inactive" >
        <div><b>Your user is inactive</b></div>
        <div>Please contact Shearis Yisroel at pesachfund@gmail.com</div>
    </div>

    <div>
        <h2 style=" display: flex; justify-content: center;">Orders</h2>
    </div>

    <div class="container">
        <table class="table mt-3 table-striped border rounded-3 shadow-sm">
            <thead>
                <tr>
                    <th>Order #</th>
                    <th>Date</th>
                    <th>Season</th>
                    <th>Order Group</th>
                    <th>Status</th>
                    <th>Order Total</th>
                    <th>Balance</th>
                </tr>
            </thead>
            <tbody id="orders-list">
            </tbody>
        </table>
    </div>
</div>

<div id="loader-overlay" class="hidden">
    <div class="loader"></div>
</div>

<script>
    <include-page url="shared-functions" /> 
    const state = {
    };
    const PRICE_MAP = {
            1: 1,
            2: 3,
            3: 2
        };

    document.addEventListener("InitDataLoaded", (e) => {
        let data = e.detail;
        let user = data.user;
        let customer = user.customer;
        state.customer = customer;
        const inactiveCustomerDiv = document.getElementById('customer-deleted');
        if(!customer){      
            inactiveCustomerDiv.style.display = "block";
        }
        loadOrders();
    });

    async function loadOrders() {
        showLoader(true);
        try{
            const response = await fetch(`/cust_report/query/3?order_ids={}&cust_id=${state.customer.id}` );
            const data = await response.json();
            const orders = data.rows;
            //sort orders by quote_created_at desc
            state.orders = orders.sort((a, b) => b.quote_created_at - a.quote_created_at);
            renderOrders();
        }catch{
            console.error("Error loading previous orders");
        }
        showLoader(false);       
    }

    async function renderOrders(){
        const ordersList = document.getElementById('orders-list');
        ordersList.innerHTML = '';
        for (let order of state.orders) {
            const formattedDate = new Date(order.quote_created_at).toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
            ordersList.innerHTML += `
                <tr>
                    <th>${order.quote_id}</th>
                    <td>${formattedDate}</td>
                    <td>${order.season_name}</td>
                    <td>${order.line_name}</td>
                    <td>${order.status}</td>
                    <td>$${order.total || 0 }</td>
                    <td>$${order.balance || 0}</td>
                    <td>
                        <a href="/pages/details-of-order?cart_id=${order.quote_id}" class="btn" style="color:#6941C6;">View</a>
                    </td>
                    ${order.invoice_id ?
                    `<td>${order.balance > 0 ? `<a href="/pages/checkout-page?cart_id=${order.quote_id}" class="btn" style="color:#6941C6;">Finish Payment</a>` : ''}</td>`
                     :
                    `<td><a href="/pages/shopping-list?cart_id=${order.quote_id}&season=${order.season__c}&price=${PRICE_MAP[order.line_id]}" class="btn" style="color:#6941C6;">Continue Order</a></td>`
                    }             
                </tr>`
        }                
    }
</script>
