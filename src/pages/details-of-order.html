<style>
    .center-div {
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100%;
        margin-top: calc(6vh + 20px);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    }

    #loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.7);
        /* dim the page */
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .loader {
        border: 8px solid #f3f3f3;
        border-top: 8px solid #3498db;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
    }

    .hidden {
        display: none;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<include-page url="navigation-bar" />
<div class="center-div" style="color:#6941C6;">

    <div>
        <h2 style=" display: flex; justify-content: center;">Order Details</h2>
    </div>

    <div id="order-error" class="alert alert-danger hidden" role="alert"></div>

    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-11">
                <table class="table mt-3 table-striped border rounded-3 shadow-sm">
                    <thead>
                        <tr>
                            <th>Order #</th>
                            <th>Date</th>
                            <th>Season</th>
                            <th>Order Group</th>
                            <th>Status</th>
                            <th>Order Total</th>
                            <th>Balance</th>
                        </tr>
                    </thead>
                    <tbody id="cart-info"> </tbody>
                </table>
            </div>
        </div>
    </div>

    
    <div>
        <h2 style=" display: flex; justify-content: center;">Order Transactions</h2>
    </div>

    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-10">
                <table class="table mt-3 table-striped border rounded-3 shadow-sm">
                    <thead>
                        <tr>
                            <th>Amount</th>
                            <th>Method</th>
                            <th>Payment Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="cart-transactions"> </tbody>
                </table>
            </div>
        </div>
    </div>

    <div>
        <h2 style=" display: flex; justify-content: center;">Order Items</h2>
    </div>

    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-10">
                <table class="table mt-3 table-striped border rounded-3 shadow-sm">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Item name</th>
                            <th>Price</th>
                            <th>Qantity</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items-list"> </tbody>
                </table>
            </div>
        </div>
    </div>


</div>
<div id="loader-overlay" class="hidden">
    <div class="loader"></div>
</div>

<script>
    <include-page url="shared-functions" />
    //this maps the ids of the cabinet lines - price range
    const PRICE_MAP = {
            1 : 1,
            3 : 2,
            2 : 3
        };

    document.addEventListener("InitDataLoaded", (e) => {
        let data = e.detail;
        let user = data.user;
        let customer = user.customer;//can remove these 3 lines?
        loadOrders();
    });

    async function loadOrders() {
        showLoader(true);
        try{
            const cartId = HELPER_FUNC.getUrlParam('cart_id');
            const response = await fetch(`/cust_report/query/3?order_ids={${cartId}}` );
            const data = await response.json();
            if (!response.ok || !data.rows?.length) {
                showOrderError("This is not your order.");
                return;
            }
            const order = data.rows[0];
            const line = PRICE_MAP[order.line_id];
            renderCartItems(order.cart_items);
            renderCartHtml(order, order.season__c, line);
            renderCartTransaction(order.payment_transactions);
        }catch{
            console.error("Error reading details of order")
        }
        showLoader(false);
    }

    function showOrderError(message) {
        const orderError = document.getElementById('order-error');
        orderError.textContent = message;
        orderError.classList.remove('hidden');
    }

    function renderCartItems(cartItems){
        const cartItemsList = document.getElementById('cart-items-list');
        cartItemsList.innerHTML = '';
        cartItems.forEach(cartItem =>{
            cartItemsList.innerHTML += `            
            <tr>
                <th>${cartItem.category_name}</th>
                <td>${cartItem.item_name}</td>
                <td>${cartItem.item_price ? `$${cartItem.item_price}` : '--'}</td>
                <td>${cartItem.qty}</td>
                <td>$${cartItem.total_price}</td>
            </tr>`;      
        });
    }

    function renderCartTransaction(cartTrans){
        const cartTransList = document.getElementById('cart-transactions');
        cartTransList.innerHTML = '';
        cartTrans.forEach(trans =>{
            const formattedDate = trans.created_at ? new Date(trans.created_at).toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }) : '--';
            cartTransList.innerHTML += `            
            <tr>
                <th>$${trans.amount}</th>
                <td>${ trans.method == 'credit_card' ? (trans.amount > 0 ? 'Credit Card' : 'Refund') : trans.method }</td>
                <td>${formattedDate}</td>
                <td>${trans.status? trans.status : '--'}</td>
            </tr>`;      
        });
    }


</script>
